version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: autospace_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prisma
    ports:
      - '2010:5432'
    volumes:
      - db_data_autospace:/var/lib/postgresql/data
volumes:
  db_data_autospace:

